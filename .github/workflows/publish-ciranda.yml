name: Publicar imagens Ciranda (GHCR)

# Imagens que o Swarm da VPS puxa. Nomes iguais aos de docker-compose.swarm.yml:
#   ghcr.io/flaviosantti/ciranda-crm:latest
#   ghcr.io/flaviosantti/ciranda-worker:latest
#   ghcr.io/flaviosantti/ciranda-scheduler:latest
#
# Imagem genérica: segredos e o Supabase real entram em runtime, não no build.

on:
  push:
    branches: [cursor/waconector-adapter]
  workflow_dispatch:

env:
  REGISTRY: ghcr.io

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: ciranda-crm
            dockerfile: Dockerfile
          - name: ciranda-worker
            dockerfile: Dockerfile.worker
          - name: ciranda-scheduler
            dockerfile: Dockerfile.scheduler
    steps:
      - uses: actions/checkout@v7

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Dono do pacote em minusculas
        id: dono
        run: echo "value=$(echo "${GITHUB_REPOSITORY_OWNER}" | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_OUTPUT"

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build e push
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          platforms: linux/amd64
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ steps.dono.outputs.value }}/${{ matrix.name }}:latest
            ${{ env.REGISTRY }}/${{ steps.dono.outputs.value }}/${{ matrix.name }}:${{ github.sha }}
          build-args: |
            APP_VERSION=${{ github.sha }}
          cache-from: type=gha,scope=ciranda-${{ matrix.name }}
          cache-to: type=gha,mode=max,scope=ciranda-${{ matrix.name }}
