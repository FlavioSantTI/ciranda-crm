name: Publicar imagens Ciranda (Docker Hub)

# Publica as mesmas imagens do workflow GHCR, mas no Docker Hub,
# onde pulls publicos nao precisam de login na VPS.
#
# Nome das imagens:
#   docker.io/flaviosantti/ciranda-crm:latest
#   docker.io/flaviosantti/ciranda-worker:latest
#   docker.io/flaviosantti/ciranda-scheduler:latest
#
# Requer secrets: DOCKERHUB_USERNAME, DOCKERHUB_TOKEN

on:
  push:
    branches: [cursor/waconector-adapter]
  workflow_dispatch:

env:
  REGISTRY: docker.io

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: ciranda-crm
            dockerfile: Dockerfile
          - name: ciranda-worker
            dockerfile: Dockerfile.worker
          - name: ciranda-scheduler
            dockerfile: Dockerfile.scheduler
    steps:
      - uses: actions/checkout@v7

      - name: Log in to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build e push
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          platforms: linux/amd64
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ secrets.DOCKERHUB_USERNAME }}/${{ matrix.name }}:latest
            ${{ env.REGISTRY }}/${{ secrets.DOCKERHUB_USERNAME }}/${{ matrix.name }}:${{ github.sha }}
          build-args: |
            APP_VERSION=${{ github.sha }}
          cache-from: type=gha,scope=dh-${{ matrix.name }}
          cache-to: type=gha,mode=max,scope=dh-${{ matrix.name }}
