name: Build e push Ciranda (Docker Hub)

on:
  push:
    branches: [cursor/waconector-adapter]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - uses: docker/setup-buildx-action@v4

      - name: Build e push app
        uses: docker/build-push-action@v7
        with:
          context: .
          file: Dockerfile
          push: true
          tags: docker.io/${{ secrets.DOCKERHUB_USERNAME }}/ciranda-crm:latest
          build-args: APP_VERSION=latest

      - name: Build e push worker
        uses: docker/build-push-action@v7
        with:
          context: .
          file: Dockerfile.worker
          push: true
          tags: docker.io/${{ secrets.DOCKERHUB_USERNAME }}/ciranda-worker:latest
          build-args: APP_VERSION=latest

      - name: Build e push scheduler
        uses: docker/build-push-action@v7
        with:
          context: .
          file: Dockerfile.scheduler
          push: true
          tags: docker.io/${{ secrets.DOCKERHUB_USERNAME }}/ciranda-scheduler:latest
          build-args: APP_VERSION=latest
